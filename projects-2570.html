const META = PAYLOAD.meta;
const ALL_RECORDS = PAYLOAD.records;

const REGION_COLORS = {
  'เหนือ': { bg: '#E8F1F8', text: '#1E40AF', accent: '#3B82F6' },
  'อีสาน': { bg: '#FEF3E2', text: '#9A3412', accent: '#EA580C' },
  'กลาง':  { bg: '#F0F4E8', text: '#3F6212', accent: '#65A30D' },
  'ใต้':   { bg: '#FCE7F3', text: '#9D174D', accent: '#DB2777' },
};

const getStatusStyle = (s) => {
  if (!s) return { bg: '#F3F4F6', text: '#4B5563', dot: '#9CA3AF' };
  if (s.includes('แล้วเสร็จ')) return { bg: '#DCFCE7', text: '#166534', dot: '#16A34A' };
  if (s.includes('อยู่ระหว่าง') || s.includes('เตรียมเสนอ')) return { bg: '#FEF3C7', text: '#92400E', dot: '#D97706' };
  if (s.includes('ยังไม่') || s.includes('ไม่ได้')) return { bg: '#FEE2E2', text: '#991B1B', dot: '#DC2626' };
  if (s.includes('ผ่าน')) return { bg: '#DCFCE7', text: '#166534', dot: '#16A34A' };
  if (s.includes('ไม่ต้อง')) return { bg: '#F3F4F6', text: '#4B5563', dot: '#9CA3AF' };
  if (s.includes('มี')) return { bg: '#FEF3C7', text: '#92400E', dot: '#D97706' };
  return { bg: '#EEF2FF', text: '#3730A3', dot: '#6366F1' };
};

const formatNum = (n) => {
  if (typeof n !== 'number') return n ?? '-';
  return n.toLocaleString('th-TH', { maximumFractionDigits: 3 });
};

const formatInt = (n) => {
  if (typeof n !== 'number') return n ?? '-';
  return n.toLocaleString('th-TH');
};

function App() {
  const [search, setSearch] = useState('');
  const [region, setRegion] = useState('ทั้งหมด');
  const [province, setProvince] = useState('ทั้งหมด');
  const [designStatus, setDesignStatus] = useState('ทั้งหมด');
  const [activity, setActivity] = useState('ทั้งหมด');
  const [includeSubtotals, setIncludeSubtotals] = useState(false);
  const [sortBy, setSortBy] = useState('no');
  const [sortDir, setSortDir] = useState('asc');
  const [expandedKey, setExpandedKey] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [showInfo, setShowInfo] = useState(false);

  const visibleBase = useMemo(() => {
    return includeSubtotals ? ALL_RECORDS : ALL_RECORDS.filter(r => !r.is_subtotal);
  }, [includeSubtotals]);

  const regions = useMemo(() => ['ทั้งหมด', ...Array.from(new Set(ALL_RECORDS.filter(r=>!r.is_subtotal).map(r => r.region))).filter(Boolean)], []);
  const provinces = useMemo(() => {
    const pool = region === 'ทั้งหมด' ? ALL_RECORDS : ALL_RECORDS.filter(r => r.region === region);
    return ['ทั้งหมด', ...Array.from(new Set(pool.map(r => r.province))).filter(Boolean).sort((a,b)=>a.localeCompare(b,'th'))];
  }, [region]);
  const designStatuses = useMemo(() => ['ทั้งหมด', ...Array.from(new Set(ALL_RECORDS.map(r => r.design_status))).filter(Boolean)], []);
  const activities = useMemo(() => ['ทั้งหมด', ...Array.from(new Set(ALL_RECORDS.map(r => r.activity))).filter(Boolean)], []);

  const filtered = useMemo(() => {
    let arr = visibleBase.filter(r => {
      if (region !== 'ทั้งหมด' && r.region !== region) return false;
      if (province !== 'ทั้งหมด' && r.province !== province) return false;
      if (designStatus !== 'ทั้งหมด' && r.design_status !== designStatus) return false;
      if (activity !== 'ทั้งหมด' && r.activity !== activity) return false;
      if (search.trim()) {
        const q = search.trim().toLowerCase();
        const hay = [r.name, r.highway, r.province, r.work_type, r.activity, r.km_start, r.km_end].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    arr.sort((a, b) => {
      let va, vb;
      if (sortBy === 'no') { va = a.is_subtotal ? -1 : a.no; vb = b.is_subtotal ? -1 : b.no; }
      else { va = a[sortBy]; vb = b[sortBy]; }
      if (va == null) return 1; if (vb == null) return -1;
      const cmp = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb), 'th', { numeric: true });
      return sortDir === 'asc' ? cmp : -cmp;
    });
    return arr;
  }, [visibleBase, search, region, province, designStatus, activity, sortBy, sortDir]);

  const stats = useMemo(() => {
    const real = filtered.filter(r => !r.is_subtotal);
    const totalCost = real.reduce((s, r) => s + (typeof r.cost === 'number' ? r.cost : 0), 0);
    const totalDist = real.reduce((s, r) => s + (typeof r.distance === 'number' ? r.distance : 0), 0);
    return { count: real.length, totalCost, totalDist, subtotalCount: filtered.length - real.length };
  }, [filtered]);

            <h1 style={{ fontSize: 24, fontWeight: 700, margin: 0, letterSpacing: -0.5, lineHeight: 1.2 }}>ขนาดใหญ่ ปี 2570</h1>
            <div style={{ fontSize: 12, opacity: 0.7, marginTop: 4 }}>ข้อมูล ณ {META.as_of}  ·  รวม {META.total_items} โครงการ</div>
          </div>
          <button onClick={() => setShowInfo(s => !s)} style={{ background: 'rgba(255,255,255,0.1)', border: '1px solid rgba(255,255,255,0.2)', borderRadius: 10, color: '#FAF8F3', width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }}>

        <StatCard icon={<DollarSign size={14} />} label="งบ" value={formatInt(stats.totalCost)} unit="ล้านบาท" accent="#D99E2F" />

        </button>
        {(activeFilterCount > 0 || search) && (
          <button onClick={clearAll} style={{ padding: '8px 12px', borderRadius: 999, border: 'none', background: 'transparent', color: '#6B7280', fontSize: 13, fontFamily: 'inherit', cursor: 'pointer', textDecoration: 'underline' }}>
            ล้างทั้งหมด
          </button>
        )}
      </div>

      {showFilters && (
        <div style={{ margin: '12px 16px 0', padding: 14, borderRadius: 16, background: '#FFFFFF', border: '1.5px solid #E5DFD3' }}>
          <FilterRow label="ภาค">
            <ChipRow options={regions} value={region} onChange={(v)=>{setRegion(v); setProvince('ทั้งหมด');}} />
          </FilterRow>
          <FilterRow label="จังหวัด">
            <select value={province} onChange={e => setProvince(e.target.value)} style={selectStyle}>
              {provinces.map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          </FilterRow>
          <FilterRow label="สถานะแบบ">
            <ChipRow options={designStatuses} value={designStatus} onChange={setDesignStatus} />
          </FilterRow>
          <FilterRow label="ประเภทกิจกรรม">
            <select value={activity} onChange={e => setActivity(e.target.value)} style={selectStyle}>
              {activities.map(a => <option key={a} value={a}>{a}</option>)}
            </select>
          </FilterRow>
          <FilterRow label="เรียงตาม">
            <div style={{ display: 'flex', gap: 8 }}>
              <select value={sortBy} onChange={e => setSortBy(e.target.value)} style={{...selectStyle, flex: 1}}>
                <option value="no">ลำดับรายการ</option>
                <option value="cost">ค่าก่อสร้าง</option>
                <option value="distance">ระยะทาง</option>
                <option value="province">จังหวัด</option>
                <option value="highway">หมายเลขทางหลวง</option>
              </select>
              <button onClick={() => setSortDir(d => d === 'asc' ? 'desc' : 'asc')} style={{ padding: '10px 14px', borderRadius: 10, border: '1.5px solid #E5DFD3', background: '#FAF8F3', fontFamily: 'inherit', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4 }}>
                {sortDir === 'asc' ? <ChevronUp size={16} /> : <ChevronDown size={16} />}
                <span style={{ fontSize: 13 }}>{sortDir === 'asc' ? 'น้อย→มาก' : 'มาก→น้อย'}</span>
              </button>
            </div>
          </FilterRow>
          <FilterRow label="แถวรวมโครงการแม่">
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 13, color: '#4B5563' }}>
              <input type="checkbox" checked={includeSubtotals} onChange={e => setIncludeSubtotals(e.target.checked)} style={{ width: 18, height: 18, accentColor: '#1E3A5F' }} />
              แสดงแถวรวมยอดของช่วงย่อย (มี {META.subtotal_rows_count} แถว ในต้นฉบับ)
            </label>
          </FilterRow>
        </div>
      )}

      <div style={{ padding: '16px' }}>
        <div style={{ fontSize: 12, color: '#6B7280', marginBottom: 10 }}>
          แสดง {filtered.length} จาก {visibleBase.length} รายการ
        </div>
        {filtered.length === 0 ? (
          <div style={{ textAlign: 'center', padding: '40px 20px', color: '#9CA3AF' }}>
            <div style={{ fontSize: 40, marginBottom: 8 }}>🔍</div>
            <div>ไม่พบโครงการที่ตรงกับเงื่อนไข</div>
          </div>
        ) : (
          filtered.map(r => {
            const k = `${r.index}-${r.row}`;
            return (
              <ProjectCard
                key={k}
                r={r}
                expanded={expandedKey === k}
                onToggle={() => setExpandedKey(e => e === k ? null : k)}
              />
            );
          })
        )}
      </div>

      <div style={{ textAlign: 'center', fontSize: 11, color: '#9CA3AF', paddingTop: 12 }}>
        ข้อมูลครบถ้วนตามต้นฉบับ · {META.total_items} โครงการ + {META.subtotal_rows_count} แถวรวม
      </div>
    </div>
  );
}

const selectStyle = {
  width: '100%', padding: '10px 12px', borderRadius: 10, border: '1.5px solid #E5DFD3',
  background: '#FAF8F3', fontSize: 14, fontFamily: 'inherit', color: '#1F2937', outline: 'none',
  appearance: 'none',
  backgroundImage: "url(\"data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e\")",
  backgroundRepeat: 'no-repeat', backgroundPosition: 'right 10px center', backgroundSize: 16, paddingRight: 36, boxSizing: 'border-box'
};

function FilterRow({ label, children }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: '#6B7280', marginBottom: 6, letterSpacing: 0.3 }}>{label}</div>
      {children}
    </div>
  );
}

function ChipRow({ options, value, onChange }) {
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
      {options.map(o => {
        const active = o === value;
        const label = o && o.length > 28 ? o.slice(0, 26) + '…' : o;
        return (
          <button key={o} title={o} onClick={() => onChange(o)} style={{
            padding: '6px 12px', borderRadius: 999, border: '1.5px solid ' + (active ? '#1E3A5F' : '#E5DFD3'),
            background: active ? '#1E3A5F' : '#FFFFFF', color: active ? '#FFFFFF' : '#4B5563',
            fontSize: 12.5, fontFamily: 'inherit', fontWeight: active ? 600 : 400, cursor: 'pointer', whiteSpace: 'nowrap'
          }}>{label}</button>
        );
      })}
    </div>
  );
}

function StatCard({ icon, label, value, unit, accent }) {
  return (
    <div style={{ background: '#FFFFFF', border: '1.5px solid #E5DFD3', borderRadius: 14, padding: '12px 10px', position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: 8, right: 8, color: accent, opacity: 0.85 }}>{icon}</div>
      <div style={{ fontSize: 10.5, color: '#6B7280', fontWeight: 600, letterSpacing: 0.5, marginBottom: 4 }}>{label}</div>
      <div style={{ fontSize: 19, fontWeight: 700, color: '#1F2937', lineHeight: 1.1, fontFamily: '"Sarabun", sans-serif' }}>{value}</div>
      <div style={{ fontSize: 10, color: '#9CA3AF', marginTop: 2 }}>{unit}</div>
    </div>
  );
}

function ProjectCard({ r, expanded, onToggle }) {
  const region = REGION_COLORS[r.region] || { bg: '#F3F4F6', text: '#4B5563', accent: '#9CA3AF' };
  const isSub = r.is_subtotal;

  return (
    <div style={{
      background: isSub ? '#FFFBEB' : '#FFFFFF',
      borderRadius: 16, marginBottom: 10, overflow: 'hidden',
      border: '1.5px solid ' + (expanded ? '#1E3A5F' : (isSub ? '#FDE68A' : '#E5DFD3')),
      boxShadow: expanded ? '0 8px 24px rgba(30, 58, 95, 0.08)' : 'none', transition: 'all 0.2s'
    }}>
      <button onClick={onToggle} style={{ width: '100%', textAlign: 'left', background: 'transparent', border: 'none', padding: 14, cursor: 'pointer', fontFamily: 'inherit', color: 'inherit' }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
          <div style={{ minWidth: 38, height: 38, borderRadius: 10, background: isSub ? '#FEF3C7' : region.bg, color: isSub ? '#92400E' : region.text, display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, fontSize: 13, fontFamily: '"Sarabun", sans-serif' }}>
            {isSub ? 'Σ' : r.no}
          </div>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginBottom: 6 }}>
              {isSub && (
                <span style={{ fontSize: 10.5, padding: '2px 8px', borderRadius: 999, background: '#FEF3C7', color: '#92400E', fontWeight: 700 }}>
                  แถวรวมยอด
                </span>
              )}
              {r.region && (
                <span style={{ fontSize: 10.5, padding: '2px 8px', borderRadius: 999, background: region.bg, color: region.text, fontWeight: 600 }}>
                  {r.region}
                </span>
              )}
              {r.province && (
                <span style={{ fontSize: 10.5, padding: '2px 8px', borderRadius: 999, background: '#F3F4F6', color: '#4B5563', display: 'inline-flex', alignItems: 'center', gap: 3 }}>
                  <MapPin size={10} /> {r.province}
                </span>
              )}
              {r.highway && (
                <span style={{ fontSize: 10.5, padding: '2px 8px', borderRadius: 999, background: '#FEF3C7', color: '#92400E', fontWeight: 600 }}>
                  ทล.{r.highway}
                </span>
              )}
            </div>
            <div style={{ fontSize: 13.5, fontWeight: 500, lineHeight: 1.45, color: '#1F2937', marginBottom: 6 }}>
              {r.name || '(ไม่มีชื่อ)'}
            </div>
            <div style={{ display: 'flex', gap: 14, alignItems: 'center', flexWrap: 'wrap' }}>
              <div style={{ display: 'flex', alignItems: 'baseline', gap: 3 }}>
                <span style={{ fontSize: 16, fontWeight: 700, color: '#1E3A5F', fontFamily: '"Sarabun", sans-serif' }}>{formatInt(r.cost)}</span>
                <span style={{ fontSize: 10.5, color: '#6B7280' }}>ลบ.</span>
              </div>
              <div style={{ fontSize: 11.5, color: '#6B7280' }}>
                {typeof r.distance === 'number' ? r.distance.toLocaleString('th-TH', {maximumFractionDigits: 3}) + ' กม.' : r.distance}
              </div>
            </div>
          </div>
          <ChevronDown size={18} color="#9CA3AF" style={{ transform: expanded ? 'rotate(180deg)' : 'none', transition: 'transform 0.2s', marginTop: 6 }} />
        </div>
      </button>

      {expanded && (
        <div style={{ padding: '0 14px 14px', borderTop: '1px dashed ' + (isSub ? '#FDE68A' : '#E5DFD3'), paddingTop: 12 }}>
          {isSub && (
            <div style={{ background: '#FEF3C7', border: '1px solid #FDE68A', borderRadius: 10, padding: 10, marginBottom: 12, fontSize: 12, lineHeight: 1.5, color: '#92400E' }}>
              <strong>หมายเหตุ:</strong> แถวนี้เป็นยอดรวมของช่วงย่อยในสายเดียวกัน ค่าก่อสร้าง/ระยะทาง = ผลรวมของรายการที่มีหมายเลขลำดับด้านล่าง ไม่ได้นับรวมเข้ายอด {META.total_items} โครงการ
            </div>
          )}
          <DetailGrid label="ข้อมูลในต้นฉบับ">
            <DetailRow icon={<Hash size={13} />} label="Index" value={r.index} mono />
            {!isSub && <DetailRow icon={<Hash size={13} />} label="ลำดับรายการ" value={r.no} />}
            <DetailRow icon={<Route size={13} />} label="หมายเลขทางหลวง" value={r.highway} />
            <DetailRow icon={<FileText size={13} />} label="ชื่อสายทาง" value={r.name} block />
            <DetailRow icon={<Building2 size={13} />} label="ลักษณะงาน" value={r.work_type} block />
            <DetailRow icon={<Activity size={13} />} label="กม. เริ่มต้น" value={r.km_start} mono block />
            <DetailRow icon={<Activity size={13} />} label="กม. สิ้นสุด" value={r.km_end} mono block />
            <DetailRow icon={<Route size={13} />} label="ระยะทาง (กม.)" value={typeof r.distance === 'number' ? r.distance.toLocaleString('th-TH', {maximumFractionDigits: 3}) : r.distance} mono />
            <DetailRow icon={<DollarSign size={13} />} label="ค่าก่อสร้าง (ลบ.)" value={formatInt(r.cost)} mono />
            <DetailRow icon={<MapPin size={13} />} label="จังหวัด" value={r.province} />
            <DetailRow icon={<MapPin size={13} />} label="ภาค" value={r.region} />
            <DetailRow icon={<Calendar size={13} />} label="กิจกรรม" value={r.activity} block />
          </DetailGrid>

          <div style={{ marginTop: 14 }}>
            <div style={{ fontSize: 11, color: '#9CA3AF', fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase', marginBottom: 8 }}>สถานะดำเนินงาน</div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr', gap: 8 }}>
              <StatusPill icon={<FileText size={12} />} label="สถานะแบบ" value={r.design_status} />
              <StatusPill icon={<Building2 size={12} />} label="เวนคืน" value={r.expropriation} />
              <StatusPill icon={<Leaf size={12} />} label="EIA" value={r.eia} />
              <StatusPill icon={<Users size={12} />} label="การมีส่วนร่วมประชาชน" value={r.public_part} />
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function DetailGrid({ label, children }) {
  return (
    <div>
      <div style={{ fontSize: 11, color: '#9CA3AF', fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase', marginBottom: 8 }}>{label}</div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>{children}</div>
    </div>
  );
}

function DetailRow({ icon, label, value, mono, block }) {
  const isEmpty = value === null || value === undefined || value === '';
  return (
    <div style={{ display: block ? 'block' : 'flex', justifyContent: 'space-between', alignItems: block ? 'flex-start' : 'baseline', gap: 8, padding: '6px 0', borderBottom: '1px solid #F3F4F6' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11.5, color: '#6B7280', fontWeight: 500, flexShrink: 0, marginBottom: block ? 4 : 0 }}>
        <span style={{ color: '#9CA3AF' }}>{icon}</span>
        {label}
      </div>
      <div style={{
        fontSize: 13, color: isEmpty ? '#D1D5DB' : '#1F2937', lineHeight: 1.5, whiteSpace: 'pre-wrap',
        textAlign: block ? 'left' : 'right',
        fontFamily: mono ? '"JetBrains Mono", monospace' : 'inherit',
        wordBreak: 'break-word'
      }}>
        {isEmpty ? '—' : String(value)}
      </div>
    </div>
  );
}

function StatusPill({ icon, label, value }) {
  const s = getStatusStyle(value);
  const isEmpty = !value;
  return (
    <div style={{ background: s.bg, borderRadius: 10, padding: '8px 10px' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 10.5, color: '#6B7280', fontWeight: 600, marginBottom: 3 }}>
        {icon}
        {label}
      </div>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 6 }}>
        <span style={{ width: 6, height: 6, borderRadius: '50%', background: s.dot, flexShrink: 0, marginTop: 6 }} />
        <span style={{ fontSize: 12, color: isEmpty ? '#9CA3AF' : s.text, fontWeight: 500, lineHeight: 1.4, whiteSpace: 'pre-wrap' }}>{value || '—'}</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
